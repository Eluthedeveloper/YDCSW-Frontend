# HSTS is only honoured by a browser when it arrives over HTTPS, and a header
# sent over plain HTTP is discarded. This container listens on :80 and expects
# TLS to terminate in front of it (Cloudflare, or a host-level proxy), so the
# header value is mapped to empty unless the request actually arrived over
# HTTPS. nginx omits any header whose value is the empty string, which is what
# makes the plain-HTTP case a no-op.
#
# Only the value is mapped: add_header takes the header name literally, so
# putting a whole "Name: value" string in the map would emit a header whose
# value is that entire string.
map $http_x_forwarded_proto $hsts_value {
    default "";
    "https" "max-age=31536000; includeSubDomains";
}

server {
  listen 80;
  server_name yemisrachdimts.org www.yemisrachdimts.org;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  client_max_body_size 200m;

  # Content Security Policy. This is the layer that matters: nginx is what
  # actually serves the HTML, so a CSP set only on the API would never be seen
  # by a browser.
  #
  # Notes on the directives that look loose:
  #  - script-src has no 'unsafe-inline'. Vite emits external module scripts,
  #    and index.html has no inline <script>, so this can stay strict.
  #  - style-src needs 'unsafe-inline' because ~20 components pass a style
  #    prop, which is an inline style attribute rather than a stylesheet.
  #  - frame-src lists the two third-party embeds the site actually renders:
  #    the radio player on the home page and the map on the contact page.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self'; frame-src https://embed.clrd.net https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Legacy fallback for the clickjacking protection that frame-ancestors in the
  # CSP above already provides for every current browser.
  add_header X-Frame-Options "SAMEORIGIN" always;

  # The site has no camera, microphone, payment, or USB use, so they are all
  # denied outright. The third-party embeds in frame-src keep their own
  # permissions; this only restricts what our own document may reach for.
  add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

  add_header Strict-Transport-Security $hsts_value always;

  # Every add_header below is expressed with `expires`, never with an
  # add_header Cache-Control. `add_header` inside a location block discards the
  # whole set inherited from the server block, so caching rules written that way
  # would silently strip the CSP and nosniff from those responses. `expires`
  # adds its Cache-Control without touching the inherited headers.

  # Hashed build output. Safe to cache forever: a content change produces a new
  # filename, so a cached entry can never be stale.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # The entry document must never be cached, or a deploy keeps serving the old
  # bundle's hashed filenames until the cache expires.
  location = /index.html {
    expires -1;
  }

  # SPA client-side routing fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy the API to the backend container.
  # Streaming is disabled so HTTP Range requests (audio seeking) pass through
  # untouched and 206 partial content reaches the browser.
  location /api/ {
    proxy_pass http://backend:7000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }
}

# The API's own subdomain. The browser never needs it — the site talks to
# /api on the apex, which keeps the session cookie first-party — but it is
# the address for direct API clients, health checks, and postman-style use.
# Everything is forwarded as-is because the backend mounts its routes at
# /api/... itself; there is no path prefix to strip or add.
server {
  listen 80;
  server_name audiostreaming.yemisrachdimts.org;

  # Uploads (admin pushes tracks/covers through the API directly).
  client_max_body_size 200m;

  location / {
    proxy_pass http://backend:7000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Range requests for audio streaming must not be buffered.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }
}
